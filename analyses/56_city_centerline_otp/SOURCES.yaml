description: "An independent check confirms the earlier finding: buses on wider, multi-lane roads run late more often. Using the City of Pittsburgh's own street map — which counts lanes on every city street, not just state highways — road width still tracks on-time performance just as strongly (correlation -0.44, versus -0.47 from the state-road data). Adding lane count to a model of route structure raises the share of on-time-performance differences explained from 43% to 60%. Two maps built by different agencies pointing to the same answer means road width is a real, robust correlate of lateness, not a quirk of one dataset."
dependencies:
  - analyses/55_road_classification_otp

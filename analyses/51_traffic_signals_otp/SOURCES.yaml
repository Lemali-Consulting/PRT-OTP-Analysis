files: []
analyses:
- id: 27
  relationship: complements the traffic-volume (AADT) test with a traffic-signal test, finding signals matter where volume did not.
dependencies:
- numpy
- polars
- scipy
description: >-
  Buses that pass more traffic signals per mile run measurably later. Counting
  every traffic signal along each route, the densest-signal routes -- inner-city
  local lines through the East End and Hill District -- average around 60% on
  time, while suburban routes with few signals run 70% or better. Signal density
  is a strong predictor of poor on-time performance even after accounting for
  how many stops a route has and how long it is, lifting the share of explained
  performance differences from 47% to 60%. Notably, an earlier analysis found
  that overall traffic volume had no such effect: it is the fixed stop-and-wait
  at each signal, not how busy the road is, that tracks with delay. PRT's own
  authoritative stop records independently confirm this: the share of a route's
  stops that sit at a signal predicts lateness just as strongly (and agrees with
  the map-based count), so the finding does not hinge on the open-data estimate.
outputs:

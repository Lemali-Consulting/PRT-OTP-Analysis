kind: analysis
title: "53 - Near-Side vs. Far-Side Stop Placement"
tables:
  - otp_monthly
files:
  - data/GTFS/stops.txt
  - data/GTFS/trips.txt
  - data/GTFS/stop_times.txt
  - data/GTFS/shapes.txt
  - data/osm-signals/traffic_signals_raw.json
analyses: []
description: "83% of PRT bus stops at signalized intersections are near-side — placed before the traffic light — while only 17% are far-side. Most PRT stops (76%) are mid-block, away from intersections entirely. Near-side placement is the overwhelming legacy default; modern transit guidance favors far-side stops because they eliminate the double-stop and give buses a rolling start on the green."
dependencies:
  - analyses/51_traffic_signals_otp
outputs:
  - output/stop_classifications.csv
  - output/route_summary.csv
  - output/system_summary.png
  - output/nearside_vs_otp.png
  - output/top_nearside_routes.png

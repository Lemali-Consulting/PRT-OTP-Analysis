kind: analysis
title: "53 - Near-Side vs. Far-Side Stop Placement"
tables:
  - otp_monthly
files:
  - path: data/GTFS/stops.txt
    description: GTFS stop locations.
  - path: data/GTFS/trips.txt
    description: GTFS shape-to-route mapping.
  - path: data/GTFS/stop_times.txt
    description: GTFS stop sequence per trip.
  - path: data/GTFS/shapes.txt
    description: GTFS route shape geometry points.
  - path: data/osm-signals/traffic_signals_raw.json
    description: Cached OpenStreetMap traffic-signal node locations for Allegheny County.
analyses: []
description: "83% of PRT bus stops at signalized intersections are near-side — placed before the traffic light — while only 17% are far-side. Most PRT stops (76%) are mid-block, away from intersections entirely. Near-side placement is the overwhelming legacy default; modern transit guidance favors far-side stops because they eliminate the double-stop and give buses a rolling start on the green."
dependencies:
  - analyses/51_traffic_signals_otp
outputs:
  - path: stop_classifications.csv
    kind: data
    description: per-stop near-side / far-side / mid-block classification.
  - path: route_summary.csv
    kind: data
    description: per-route near-side share summary.
  - path: system_summary.png
    kind: image
    description: system-wide near-side vs. far-side vs. mid-block breakdown.
  - path: nearside_vs_otp.png
    kind: image
    description: route near-side fraction vs. on-time performance.
  - path: top_nearside_routes.png
    kind: image
    description: routes with the highest near-side stop share.

description: PRT spends $3.34 per trip on vehicle maintenance — the highest of 8 peer
  cities and 47% above average. Bus fleet age does not explain the gap (PRT's buses
  are mid-age at 7.1 years), but the light rail fleet averages 32 years old. General
  administration is PRT's leanest cost category at $2.23 per trip.

- route_road_class
- route_traffic
- route_stops
- routes
- stops
files: []
analyses: []
description: >-
  Buses that run along wider, multi-lane roads are consistently more likely to run
  late. Accounting for the type of road a route travels — especially its number of
  lanes — explains far more of the gap in on-time performance between routes than
  route length, stop count, or overall traffic volume do, lifting the share of
  variation explained from 40% to 58%. The likely culprit is congested multi-lane
  city streets clogged with traffic signals and turning cars, not fast highways:
  where wide roads actually move at speed, buses keep their schedule.
dependencies:
- numpy
- polars
- scipy

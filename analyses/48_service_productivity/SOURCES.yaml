kind: analysis
title: "48 - Service Productivity (Passengers per Revenue Hour)"
group: Equity and Strategic Planning
tables:
  - ntd_annual_service
files: []
description: >-
  Each hour of PRT's fixed-route service carries about 40% fewer riders than
  it did in 1991 — productivity fell from 39 passengers per service hour to
  23. Both service and ridership fell, but ridership fell far faster: service
  hours dropped 26% while ridership dropped 57%, so buses and trains are
  running emptier rather than being right-sized to demand. PRT's 32% drop
  since 2019 is the steepest of 8 peer cities. Population loss is not the
  cause: Allegheny County has only about 8% fewer residents than in 1991, so
  ridership per resident has itself roughly halved — fewer residents explains
  only about a tenth of the decline. Correction (June 2026): an earlier
  version of this analysis reported service hours as "barely moved" (down
  just 5%). That figure was wrong because the federal NTD database quietly
  added ACCESS paratransit hours to its agency-wide total starting in 2008,
  creating an artificial 18% jump that masked real service cuts. The charts
  and numbers above use a corrected series that excludes paratransit
  throughout for a fair comparison.
analyses:
  - id: 39
    relationship: pairs supply-side service-cut analysis with the productivity ratio it feeds into.
  - id: 40
    relationship: uses the same 8 peer cities and NTD ridership/service-hour data.
  - id: 41
    relationship: complements the per-trip cost analysis with a physical service-productivity measure.
  - id: 50
    relationship: splits this agency-wide productivity metric into its four modes — bus, light rail, paratransit, and incline.
dependencies:

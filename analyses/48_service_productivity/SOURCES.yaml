    kind: data
    description: PRT ridership, service hours, and productivity for every year 1991-2024.
  - path: peer_productivity.csv
    kind: data
    description: Productivity at 1991, 2019, and 2024 for all 8 peer cities with percent changes.
  - path: prt_productivity_trend.png
    kind: image

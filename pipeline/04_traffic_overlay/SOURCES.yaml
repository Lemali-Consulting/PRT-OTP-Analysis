kind: pipeline
title: Traffic Overlay ETL
description: Computes route-level traffic exposure metrics by spatially joining GTFS and PennDOT AADT data.
files:
  - path: data/penndot-traffic/aadt_raw.json
    description: Cached PennDOT ArcGIS feature response for Allegheny County roadway segments.
  - path: data/GTFS/shapes.txt
    description: GTFS route shape geometry points.
  - path: data/GTFS/trips.txt
    description: GTFS shape-to-route mapping.
apis:
  - name: PennDOT ArcGIS Roadway Traffic Layer
    url: https://gis.penndot.gov/arcgis/rest/services/opendata/roadwaytraffic/MapServer/0/query
    description: Public roadway segment AADT and truck percentage attributes.
tables: []
tables_produced:
  - name: route_traffic
    description: Route-level traffic exposure metrics including weighted AADT and match quality.

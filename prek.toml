[[repos]]
repo = "local"
hooks = [
  {
    id = "validate-manifests",
    name = "Validate manifests",
    language = "system",
    entry = "uv run python validate_manifests.py",
    always_run = true,
    pass_filenames = false,
  },
  {
    id = "pytest",
    name = "Run tests",
    language = "system",
    entry = "uv run pytest tests/ -q",
    always_run = true,
    pass_filenames = false,
  },
]

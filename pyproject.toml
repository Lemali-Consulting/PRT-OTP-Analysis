[project]
name = "prt-otp-analysis"
version = "0.1.0"
description = "PRT OTP (On-Time Performance) Analysis"
requires-python = ">=3.14"
dependencies = [
    "polars>=1.38.1",
    "matplotlib>=3.10",
    "folium>=0.20.0",
    "scipy>=1.14",
    "statsmodels>=0.14.6",
    "fastexcel>=0.12",
    "jinja2>=3.1",
    "mistune>=3.0",
    "pyyaml>=6.0",
    "geopandas>=1.1.3",
    "shapely>=2.1.2",
    "pyproj>=3.7.2",
    "pyogrio>=0.12.1",
    "pyarrow>=24.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prt_otp_analysis"]
